{% extends "base.html" %}
{% block title %}Add Prospect – OutreachPro{% endblock %}
{% block content %}
<div class="top"><div><h1>Add Prospect</h1><p>Create a new business opportunity.</p></div></div>
<form class="panel form" method="post">
<div class="form-grid">
<label>Name<input name="name" required></label>
<label>Company<input name="company" required></label>
<label>Email<input type="email" name="email"></label>
<label>Phone<input name="phone"></label>
<label>Source<select name="source"><option>Website</option><option>LinkedIn</option><option>Referral</option><option>Cold Call</option><option>Email</option><option>Event</option><option>Other</option></select></label>
<label>Status<select name="status">{% for s in statuses %}<option>{{ s }}</option>{% endfor %}</select></label>
<label>Opportunity Value (₹)<input type="number" name="value" min="0" value="0"></label>
<label>Next Follow-up<input type="date" name="next_followup"></label>
</div>
<label>Notes<textarea name="notes" rows="5"></textarea></label>
<button class="btn">Save Prospect</button>
</form>
{% endblock %}
